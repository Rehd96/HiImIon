# Portfolio at the ROOT of labustagialla.it.
#
# TEMPLATE — the /static/ alias below assumes /home/ion/HiImIon. On the VPS the
# path is usually /root/HiImIon. STEP 5b of VPS_COMMANDS.txt generates this file
# with the real path filled in; prefer that over pasting this by hand. A wrong
# alias shows up as a 404 on /static/css/site.css and an unstyled site.
#
# Drop these location blocks into the existing `server { listen 443 ssl; }`
# block for labustagialla.it — the one that already serves /cff, /fai and /ezbk.
# Those subpath blocks keep working untouched: nginx matches the more specific
# prefix first, so only requests that fall through to `/` reach this app.
#
# Gunicorn binds 127.0.0.1:8010, so nothing here is reachable except via nginx.
#
# Rate-limit zones — add once at http{} scope, e.g. /etc/nginx/conf.d/ratelimits.conf:
#   limit_req_zone  $binary_remote_addr zone=portfolio_login:10m rate=5r/m;
#   limit_req_zone  $binary_remote_addr zone=portfolio_all:10m   rate=120r/m;

# ─── Static files, served by nginx directly ──────────────────────────────
location /static/ {
    alias /home/ion/HiImIon/staticfiles/;
    access_log off;
    # Filenames are content-hashed by collectstatic, so this is safe.
    expires 30d;
    add_header Cache-Control "public, immutable";
}

# ─── Admin panel: strict rate limit on login ─────────────────────────────
location = /panel/login/ {
    limit_req zone=portfolio_login burst=3 nodelay;

    proxy_pass http://127.0.0.1:8010;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ─── Django's own admin: localhost only, panel is the real interface ─────
location /django-admin/ {
    allow 127.0.0.1;
    deny all;

    proxy_pass http://127.0.0.1:8010;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ─── Everything else ─────────────────────────────────────────────────────
location / {
    limit_req zone=portfolio_all burst=40 nodelay;

    proxy_pass http://127.0.0.1:8010;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    proxy_connect_timeout 10s;
    proxy_read_timeout    30s;
}
