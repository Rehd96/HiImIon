# Complete replacement for /etc/nginx/sites-available/writerblog
#
# Final topology on labustagialla.it:
#   /            portfolio    127.0.0.1:8010   (this repo)
#   /blog/       writerblog   127.0.0.1:8000   (moved off the root)
#   /ezbk/       ezBookkeeping 127.0.0.1:8080  (unchanged)
#   /cff/…       festival      fest_web/fest_api via the include (unchanged)
#
# Changes from the previous version, all on the writerblog side:
#   /static/        → /blog/static/
#   /panel/login/   → /blog/panel/login/
#   /django-admin/  → /blog/django-admin/
#   location /      → location /blog/
#   /media/         → DELETED. blog.gate_views.protected_media gates uploads
#                     behind membership, so Django must serve them; an nginx
#                     alias would hand them out to anyone with the URL.
#   + X-Forwarded-Proto added to every blog block. writerblog sets
#     SECURE_PROXY_SSL_HEADER but nginx never sent the header, so Django saw
#     every request as plain HTTP.
#
# The /ezbk/ blocks, the festival include and all TLS directives are unchanged.
#
# Rate-limit zones: reuses the existing wb_auth / wb_global from
# /etc/nginx/conf.d/writerblog-rate-limits.conf rather than defining new ones —
# they are already tuned for this box and one fewer file can go wrong.

server {
    server_name labustagialla.it www.labustagialla.it;

    limit_req_status 429;

    # ─────────────────────────────────────────────────────────────────────
    #  BLOG — writerblog on :8000, everything under /blog/
    # ─────────────────────────────────────────────────────────────────────

    location /blog/static/ {
        alias /root/writerblog/staticfiles/;
    }

    # NOTE: no /blog/media/ block on purpose — it falls through to location
    # /blog/ below so Django can enforce the membership gate on uploads.

    location /blog/panel/login/ {
        limit_req zone=wb_auth burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /blog/django-admin/ {
        allow 127.0.0.1;
        deny all;
        limit_req zone=wb_auth burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /blog/ {
        limit_req zone=wb_global burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /blog {
        return 301 /blog/;
    }

    # ─────────────────────────────────────────────────────────────────────
    #  EZBOOKKEEPING — unchanged
    # ─────────────────────────────────────────────────────────────────────

    location /ezbk/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /ezbk {
        return 301 /ezbk/;
    }

    # ─────────────────────────────────────────────────────────────────────
    #  PORTFOLIO — this repo on :8010, owns the root
    # ─────────────────────────────────────────────────────────────────────

    location /static/ {
        alias /root/HiImIon/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /panel/login/ {
        limit_req zone=wb_auth burst=3 nodelay;
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /django-admin/ {
        allow 127.0.0.1;
        deny all;
        limit_req zone=wb_auth burst=3 nodelay;
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=wb_global burst=20 nodelay;
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # ─────────────────────────────────────────────────────────────────────
    #  TLS + festival — unchanged
    # ─────────────────────────────────────────────────────────────────────

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/labustagialla.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/labustagialla.it/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    include /opt/festival/deploy/nginx/festival.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.labustagialla.it) {
        return 301 https://$host$request_uri;
    }
    if ($host = labustagialla.it) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name labustagialla.it www.labustagialla.it;
    return 404;
}
